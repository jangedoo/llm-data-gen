[tool.poetry]
name = "datagen"
version = "0.1.0"
description = ""
authors = ["Sanjaya Subedi <jangedoo@gmail.com>"]
readme = "README.md"
packages = [{include = "datagen"}]
include = [
    "datagen/web/frontend/dist/**/*",
]

[tool.poetry.dependencies]
python = "^3.11"
datasets = "^2.21.0"
pandas = "^2.2.2"
click = "^8.1.7"
openai = "^2.3.0"
python-dotenv = "^1.0.1"
tomli-w = "^1.2.0"
jinja2 = "^3.1.6"
fastapi = "^0.115.6"
uvicorn = "^0.32.1"
python-multipart = "^0.0.19"


[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
rope = "^1.13.0"
black = "^24.8.0"
flake8 = "^7.1.1"
pytest = "^8.3.4"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
datagen = "datagen.__main__:cli"
