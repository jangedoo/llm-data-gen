dataset_name = "Dataset generated with triplets generator"
description = "Dataset created using the triplets generator"
authors = [
    "Sanjaya Subedi <jangedoo@gmail.com>",
]
generation_output_dir = "../raw_data/triplets"
generation_logging_steps = 100

[sources.nepalinews]
path = "jangedoo/nepalinews"
split = "train"

[models."gpt-4.1-mini"]
backend = "litellm"

[models."gpt-4.1-mini".params]
model = "gpt-4.1-mini"
temperature = 0.3
max_tokens = 4000


[generator]
generator = "triplets"

[generator.params]
default_model = "gpt-4.1-mini"
default_system_prompt = """\
You will be given an original sentence. Your task is to generate two sentences:

1. Positive Sentence (Hard Positive):
   - Must have the same meaning as the original but expressed in a different way so that it is not a trivial paraphrase.
   - Avoid word-for-word similarity or simple synonym replacement.
   - Use different sentence structures, for example:
       * Change active to passive voice (or vice versa)
       * Report indirectly
       * Use descriptive or summarizing phrasing
       * Add minor contextual detail or reframe the statement while keeping meaning intact
   - Do NOT start the positive with the same 3 words as the original.
   - Aim for less than 50% lexical overlap.

2. Negative Sentence (Hard Negative):
   - Must be topically related but semantically different.
   - Should share some words or context (so that it’s not completely unrelated), but the fact or claim should differ.
   - Avoid obvious contradictions; instead, make the negative plausible but incorrect.

Guidelines:
- Ensure all sentences are natural and fluent.
- Avoid making negatives too easy by introducing random facts.
- For positives, summarize or restructure rather than copy.
- Maintain contextual realism.

Examples:

Original: बैतडीमा आज बिहान ५.१ म्याग्निच्युडको भूकम्प गएको छ, जसमा मानिसहरू त्रसित भएका छन्।
Positive: आज बिहान बैतडीमा गएको ५.१ म्याग्निच्युडको भूकम्पपछि स्थानीय बासिन्दाहरू आत्तिएको बताइएको छ।
Negative: बैतडीमा आज बिहान मुसलधारे वर्षाले सडक यातायात प्रभावित बनाएको छ।

Original: Novak Djokovic secured his first win on clay this season by defeating Marton Fucsovics 6-2, 6-3 in the second round of the Geneva Open.
Positive: In Geneva’s second round, Djokovic claimed his initial clay victory of the season, outplaying Fucsovics in straight sets.
Negative: Djokovic suffered an early exit on hard courts after losing to Fucsovics in the first round of the same tournament.

Original: भरतपुरका बालविकास शिक्षक रेखा रानाभाट र अन्य ३६ हजार सहजकर्ताहरूले विद्यालय शिक्षा विधेयकले आफ्नो माग सम्बोधन नगर्दा आन्दोलन गरेका छन्।
Positive: विद्यालय शिक्षा विधेयकले मागहरू बेवास्ता गरेको भन्दै रेखा रानाभाटसहित ३६ हजारभन्दा बढी सहजकर्ताहरूले प्रदर्शन गरेका छन्।
Negative: सहजकर्ताहरूले विद्यालय शिक्षा विधेयकको समर्थनमा स्वागत र्याली आयोजना गरेका छन्।

Original: Tottenham Hotspur defeats Manchester United 1-0 to win the Europa League, ending a 17-year trophy drought and securing a place in next season's Champions League.
Positive: Spurs broke their 17-year trophy drought by clinching the Europa League with a narrow 1-0 win over Manchester United, earning a Champions League berth.
Negative: Manchester United overcame Spurs in the Europa League final to book a spot in next season’s Champions League.
"""
source_datasets = [
    { name="nepalinews", sentence_column="excerpt", max_records=2000, shuffle=true }
]

[curator.params]
upload_to_hf = true
upload_repo_id = "jangedoo/nepali-triplets"
update_card = true
language = [
    "en", "ne",
]
license = "mit"
task_categories = []
task_ids = []
